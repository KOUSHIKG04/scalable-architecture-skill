name: Architecture

on:
  pull_request:
  push:
    branches: [main]

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate skill resources
        run: npm test

      - name: Check architecture boundaries
        run: node skills/vaastu/scripts/check-architecture.mjs
