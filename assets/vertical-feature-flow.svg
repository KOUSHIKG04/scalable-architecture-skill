<linearGradient id="ochre" x2="0" y2="1"><stop stop-color="#f4d986"/><stop offset="1" stop-color="#eac466"/></linearGradient>
<filter id="shadow" x="-15%" y="-30%" width="140%" height="180%"><feGaussianBlur stdDeviation="5"/></filter>
