<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="648" viewBox="0 0 1040 648" role="img" aria-labelledby="title desc">
<title id="title">End-to-end vertical feature flow</title>
<desc id="desc">UI / Client → Route / Adapter → Owning Feature → Runtime Validation → Authentication / Authorization → Application / Domain Logic → Data Access → Database / Integration → Response / Cache → UI Update. Arrows show the direction; numbers preserve the reading order.</desc>
